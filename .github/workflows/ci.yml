name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, typecheck, build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run validate

      - name: Install pinned Paseo compatibility client
        run: npm install --prefix .tmp-paseo-client --ignore-scripts --no-audit --no-fund --save-exact @getpaseo/server@0.13.2

      - name: Test real Paseo ACP client compatibility
        run: npm run test:paseo-client
